    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --accent-success: #10b981;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #475569;
            --radius: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--bg-card);
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(to right, #60a5fa, #3b82f6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 73px);
        }

        /* Sidebar Navigation */
        nav {
            width: 280px;
            background-color: var(--bg-card);
            border-right: 1px solid var(--border);
            padding: 1.5rem 1rem;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            overflow-y: auto;
        }

        .nav-btn {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            cursor: pointer;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .nav-btn:hover, .nav-btn.active {
            background-color: var(--bg-input);
            color: var(--text-main);
        }

        .nav-btn.active {
            border-left: 4px solid var(--accent);
            background-color: rgba(59, 130, 246, 0.1);
        }

        /* Main Workbench Workspace */
        main {
            flex: 1;
            padding: 2rem;
            overflow-y: auto;
            background-color: #0b0f19;
        }

        .tool-panel {
            display: none;
            animation: fadeIn 0.3s ease-in-out forwards;
        }

        .tool-panel.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.95rem;
        }

        /* Drag & Drop Zone */
        .dropzone {
            border: 2px dashed var(--border);
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s ease;
            position: relative;
            margin-bottom: 2rem;
        }
